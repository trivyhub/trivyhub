image:
  repository: ghcr.io/ton-org/trivyhub
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  host: trivyhub.exemple.com
  tls: false
  tlsSecretName: ""

env:
  JWT_SECRET: "change-me-in-production"
  DATABASE_URL: "postgresql://trivyhub:secret@postgres:5432/trivyhub"

# Optionnel : déployer PostgreSQL dans le même chart
postgres:
  enabled: true
  image: postgres:16-alpine
  database: trivyhub
  user: trivyhub
  password: secret
  storageSize: 5Gi
  # Sans requests, le scheduler place ce pod a l'aveugle : il ne reserve rien
  # et surengage le noeud. Sans limits, un emballement peut evincer les
  # voisins. Dimensionne sur la consommation observee en prod (6m CPU, 25 Mi)
  # avec la marge des pics d'ecriture et du cache partage de PostgreSQL.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
